<!doctype html>
<!--
The source of the organization profile's teaser, ../teaser-light.png and
../teaser-dark.png: the headline and the opening of latere.ai, beside the
Lorenz attractor, the figure behind the Latere mark, drawn as a field of dots
with one point in the accent color traveling it.

The page is 1200 by 450 CSS pixels and takes its theme from ?theme=light or
?theme=dark. Render both at twice that size with a chrome-headless-shell
binary (Playwright installs one), from this directory:

  for t in light dark; do
    chrome-headless-shell --screenshot="$PWD/../teaser-$t.png" \
      --window-size=1200,450 --force-device-scale-factor=2 --hide-scrollbars \
      --default-background-color=00000000 --virtual-time-budget=5000 \
      "file://$PWD/teaser.html?theme=$t"
  done

Rerender after the headline or its first sentences change on latere.ai. The
fonts are the Latin subsets of Inter and Instrument Serif, each under the SIL
Open Font License 1.1 (LICENSE-Inter.txt, LICENSE-Instrument-Serif.txt).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latere: Trustworthy Superintelligence</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(inter-400-latin.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 500; src: url(inter-500-latin.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(instrument-serif-italic-latin.woff2) format('woff2'); }

:root {
  --bg: #fafafa;
  --text: #0a0a0a;
  --lede: #4a4a4a;
  --edge: rgba(0, 0, 0, .10);
  --grid: rgba(0, 0, 0, .035);
  --signal: #c4511f;
}
:root[data-theme="dark"] {
  --bg: #09090b;
  --text: #fafafa;
  --lede: #a1a1aa;
  --edge: rgba(255, 255, 255, .14);
  --grid: rgba(255, 255, 255, .025);
  --signal: #e54d2e;
}

* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 450px; overflow: hidden; background: transparent; }
body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: var(--text); }

/* The sheet: the site's ground and its page grid, with corners that leave
   the page behind it showing, so one image sits on any GitHub theme. */
.sheet {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  border-radius: 28px;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 -7px / 64px 64px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) -8px 0 / 64px 64px,
    var(--bg);
}
.sheet::after {
  content: '';
  position: absolute; inset: 0;
  border: 1px solid var(--edge);
  border-radius: inherit;
}

/* The figure fills the sheet beneath the text; its center sits in the right
   half, clear of the headline. */
.field { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--text); }

.copy {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  padding: 44px 56px 46px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 44px; height: auto; }
.brand span { font: italic 30px/1 'Instrument Serif', serif; letter-spacing: -.01em; }
.hero { align-self: end; }
h1 { font: 500 78px/1 Inter, sans-serif; letter-spacing: -.04em; }
h1 em { display: block; font: italic 400 84px/1 'Instrument Serif', serif; letter-spacing: -.01em; }
p {
  max-width: 530px;
  margin-top: 22px;
  font-size: 18px; line-height: 1.55; letter-spacing: -.006em;
  color: var(--lede);
  text-wrap: pretty;
}
</style>
</head>
<body>
<div class="sheet">
  <canvas class="field" aria-hidden="true"></canvas>
  <div class="copy">

    <div class="hero">
      <h1>Trustworthy<em>Superintelligence.</em></h1>
      <p>Latere builds autonomous agents you can hand real work to, from a published website to a checked paper. They act within your rules and record every step.</p>
    </div>
  </div>
</div>
<script>
document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'light';

// One still frame of the dot field: a trajectory of the Lorenz system is
// rotated to a three-quarter view, projected with perspective and rasterized
// onto a hexagonal grid. Where the trajectory is dense or near, the dot is
// larger and darker. The accent marks one point of the trajectory and the
// stretch behind it.
const SPACING = 5;                       // distance between dot centers
const ROW = SPACING * Math.sqrt(3) / 2;  // row height of the hexagonal grid
const R_MAX = SPACING * 0.4, R_MIN = 0.5;
const GAIN = 0.27;                       // how fast a cell saturates
const LEVELS = 6;                        // alpha levels the dots fall into
const CAMERA = 7;                        // camera distance, in figure radii
const COUNT = 8000;                      // points on the trajectory
const TRAIL = 150;                       // points the accent trails
const YAW = Math.PI / 4 + 0.3, PITCH = 0.14;
// The figure's radius as a share of the sheet's height, and its center as
// shares of the width and the height.
const FILL = 0.72, CX = 0.74, CY = 0.53;

function trajectory(count, dt = 0.005, transient = 2000) {
  const sigma = 10, rho = 28, beta = 8 / 3;
  let x = 0.1, y = 0, z = 20;
  const step = () => {
    const dx = sigma * (y - x) * dt, dy = (x * (rho - z) - y) * dt, dz = (x * y - beta * z) * dt;
    x += dx; y += dy; z += dz;
  };
  for (let i = 0; i < transient; i++) step();
  const out = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) { step(); out[i * 3] = x; out[i * 3 + 1] = y; out[i * 3 + 2] = z; }
  return out;
}

// Centered on the attractor's axis of symmetry and scaled to unit radius:
// across, up the lobes (screen down positive), and depth.
function figure(count) {
  const raw = trajectory(count);
  let minZ = Infinity, maxZ = -Infinity;
  for (let i = 0; i < count; i++) { const z = raw[i * 3 + 2]; if (z < minZ) minZ = z; if (z > maxZ) maxZ = z; }
  const cz = (minZ + maxZ) / 2;
  let r = 0;
  for (let i = 0; i < count; i++) r = Math.max(r, Math.hypot(raw[i * 3], raw[i * 3 + 1], raw[i * 3 + 2] - cz));
  const out = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    out[i * 3] = raw[i * 3] / r;
    out[i * 3 + 1] = -(raw[i * 3 + 2] - cz) / r;
    out[i * 3 + 2] = raw[i * 3 + 1] / r;
  }
  return out;
}

function draw(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const style = getComputedStyle(canvas);
  const ink = style.color, signal = style.getPropertyValue('--signal').trim();
  const cols = Math.ceil(w / SPACING) + 2, rows = Math.ceil(h / ROW) + 2;
  const at = (cell) => {
    const row = (cell / cols) | 0, col = cell - row * cols;
    return [col * SPACING + (row & 1 ? SPACING / 2 : 0), row * ROW];
  };
  const cellOf = (x, y) => {
    const row = Math.round(y / ROW);
    if (row < 0 || row >= rows) return -1;
    const col = Math.round((x - (row & 1 ? SPACING / 2 : 0)) / SPACING);
    return col < 0 || col >= cols ? -1 : row * cols + col;
  };
  const ox = w * CX, oy = h * CY;

  // The matrix the figure lights up: a faint dot in every cell, fading out
  // with distance from the figure's center.
  ctx.fillStyle = ink;
  const reach = Math.max(ox, w - ox, oy, h - oy);
  for (let cell = 0; cell < cols * rows; cell++) {
    const [x, y] = at(cell);
    const d = Math.hypot(x - ox, y - oy) / reach;
    if (d >= 1) continue;
    ctx.globalAlpha = 0.09 * (1 - d * d);
    ctx.beginPath(); ctx.arc(x, y, R_MIN, 0, Math.PI * 2); ctx.fill();
  }

  // Project every point, then center the outline it draws on the figure's
  // place.
  const pts = figure(COUNT), scale = h * FILL;
  const sx = new Float32Array(COUNT), sy = new Float32Array(COUNT), depth = new Float32Array(COUNT);
  const cyaw = Math.cos(YAW), syaw = Math.sin(YAW), cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < COUNT; i++) {
    const X = pts[i * 3], Y = pts[i * 3 + 1], Z = pts[i * 3 + 2];
    const x1 = X * cyaw + Z * syaw, z1 = -X * syaw + Z * cyaw;
    const y2 = Y * cp - z1 * sp, z2 = Y * sp + z1 * cp;
    const persp = CAMERA / (CAMERA + z2);
    sx[i] = x1 * scale * persp; sy[i] = y2 * scale * persp; depth[i] = z2;
    minX = Math.min(minX, sx[i]); maxX = Math.max(maxX, sx[i]);
    minY = Math.min(minY, sy[i]); maxY = Math.max(maxY, sy[i]);
  }
  const shiftX = ox - (minX + maxX) / 2, shiftY = oy - (minY + maxY) / 2;
  const weight = new Float32Array(cols * rows);
  for (let i = 0; i < COUNT; i++) {
    const cell = cellOf(sx[i] += shiftX, sy[i] += shiftY);
    // Nearer points weigh more: depth runs from -1 (near) to 1 (far).
    if (cell >= 0) weight[cell] += 0.35 + 0.65 * (1 - depth[i]) / 2;
  }
  for (let cell = 0; cell < cols * rows; cell++) {
    if (!weight[cell]) continue;
    const v = 1 - Math.exp(-weight[cell] * GAIN);
    const level = Math.min(LEVELS - 1, (v * LEVELS) | 0);
    const [x, y] = at(cell);
    ctx.globalAlpha = 0.22 + 0.78 * (level + 1) / LEVELS;
    ctx.beginPath(); ctx.arc(x, y, R_MIN + (R_MAX - R_MIN) * v, 0, Math.PI * 2); ctx.fill();
  }

  // The accent: one point of the trajectory and its fading trail, on the
  // same grid as the rest.
  ctx.fillStyle = signal;
  const head = Math.floor(COUNT * 0.37);
  const accent = new Map();
  for (let k = TRAIL - 1; k >= 0; k--) {
    const i = (head - k + COUNT) % COUNT;
    const cell = cellOf(sx[i], sy[i]);
    if (cell >= 0) accent.set(cell, Math.max(accent.get(cell) || 0, 1 - k / TRAIL));
  }
  for (const [cell, a] of accent) {
    const [x, y] = at(cell);
    ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(x, y, R_MAX, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 0.14;
  ctx.beginPath(); ctx.arc(sx[head], sy[head], R_MAX * 3.2, 0, Math.PI * 2); ctx.fill();
}

draw(document.querySelector('.field'));
</script>
</body>
